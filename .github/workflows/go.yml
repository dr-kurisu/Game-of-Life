name: Go

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23'

    - name: Build
      working-directory: Game-of-Life-client/  # Set the working directory here
      run: go build

    - name: Test
      working-directory: Game-of-Life-client/  # Set the working directory here
      run: go test -v ./...
